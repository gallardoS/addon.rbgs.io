name: Publish Forever addon

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'rbgs.io/**'
      - 'tools/package_forever.py'
      - 'tools/prepare_release.py'
      - 'tools/publish_curseforge.py'
      - 'tools/test_release.py'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.github/workflows/publish-forever.yml'
  pull_request:
    paths:
      - 'rbgs.io/**'
      - 'tools/package_forever.py'
      - 'tools/prepare_release.py'
      - 'tools/publish_curseforge.py'
      - 'tools/test_release.py'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.github/workflows/publish-forever.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Upload to CurseForge (main or a stable version tag)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require stable tags to reference main history
        if: startsWith(github.ref, 'refs/tags/')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install verification tools
        run: |
          sudo apt-get update && sudo apt-get install -y lua5.1
          python -m pip install -r tools/requirements-test.txt
      - name: Verify Lua and run tests
        run: |
          find rbgs.io RBGSCompatibility -name '*.lua' -print0 | xargs -0 -n 1 luac5.1 -p
          python -m unittest discover -s tools -p 'test_*.py'
      - name: Generate version, ZIP and upload metadata
        run: python tools/prepare_release.py
      - name: Keep the generated package and metadata
        uses: actions/upload-artifact@v4
        with:
          name: forever-${{ github.run_number }}-${{ github.run_attempt }}
          path: releases/
          if-no-files-found: error
          retention-days: 30
      - name: Upload to CurseForge
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: python tools/publish_curseforge.py --release-dir releases
